{% extends "base.html" %}

{% block title %}Delete Medication | PetCare{% endblock %}

{% block content %}

<section class="pet-page">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="delete-card reveal">

    <div class="delete-icon">
        <i class="fa-solid fa-pills"></i>
    </div>

    <span class="page-kicker">
        Medication
    </span>

    <h1>
        Remove {{ medication.medication_name }}?
    </h1>

    <p>
        This medication entry will be removed from the
        medical record.
    </p>

    <form method="post">

        {% csrf_token %}

        <div class="delete-actions">

            <a
                href="{% url 'medical_record_detail' pet.pet_id record.record_id %}"
                class="pet-btn pet-btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="danger-button"
            >
                <i class="fa-solid fa-trash"></i>
                Remove medication
            </button>

        </div>

    </form>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
