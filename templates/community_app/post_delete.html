{% extends "base.html" %}

{% block title %}
Delete Post | PetCare
{% endblock %}


{% block content %}

<section class="pet-page">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

    <div class="delete-card reveal">

        <div class="delete-icon">
            <i class="fa-regular fa-message"></i>
        </div>


        <span class="page-kicker">
            Community
        </span>


        <h1>
            Delete this post?
        </h1>


        <p>
            <strong>
                {{ post.title }}
            </strong>

            and its comments will be permanently removed.
        </p>


        <form method="post">

            {% csrf_token %}


            <div class="delete-actions">

                <a
                    href="{% url 'community_post_detail' post.post_id %}"
                    class="pet-btn pet-btn-secondary"
                >
                    Keep post
                </a>


                <button
                    type="submit"
                    class="danger-button"
                >
                    <i class="fa-solid fa-trash"></i>
                    Delete post
                </button>

            </div>

        </form>

    </div>

</div>

</div>

</div>

</section>

{% endblock %}
