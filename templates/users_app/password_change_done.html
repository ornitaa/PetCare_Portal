{% extends "base.html" %}

{% block title %}
Password Updated | PetCare Portal
{% endblock %}


{% block content %}

<section class="pet-page">

<div class="container">


    <div class="row justify-content-center">

        <div class="col-lg-7 col-xl-6">

            <div class="password-success-card reveal">

                <div class="password-success-icon">
                    <i class="fa-solid fa-check"></i>
                </div>

                <span class="page-kicker">
                    Account security
                </span>

                <h1>
                    Password updated
                </h1>

                <p>
                    Your PetCare Portal password has been changed successfully.
                    You can continue using your account normally.
                </p>


                <div class="password-success-actions">

                    <a
                        href="{% url 'account_profile' %}"
                        class="pet-btn pet-btn-primary"
                    >
                        <i class="fa-regular fa-user"></i>
                        Back to profile
                    </a>

                    <a
                        href="{% url 'dashboard' %}"
                        class="pet-btn pet-btn-secondary"
                    >
                        Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</section>

{% endblock %}
