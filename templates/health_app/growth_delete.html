{% extends "base.html" %}

{% block title %}
Delete Growth Record | PetCare
{% endblock %}


{% block content %}

<section class="pet-page">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

    <div class="delete-card reveal">

        <div class="delete-icon">
            <i class="fa-solid fa-chart-line"></i>
        </div>


        <span class="page-kicker">
            Growth tracking
        </span>


        <h1>
            Delete this measurement?
        </h1>


        <p>
            The growth entry recorded on
            <strong>
                {{ record.measured_on|date:"F d, Y" }}
            </strong>
            will be permanently removed.
        </p>


        <form method="post">

            {% csrf_token %}


            <div class="delete-actions">

                <a
                    href="{% url 'growth_list' pet.pet_id %}"
                    class="pet-btn pet-btn-secondary"
                >
                    Keep measurement
                </a>


                <button
                    type="submit"
                    class="danger-button"
                >
                    <i class="fa-solid fa-trash"></i>
                    Delete measurement
                </button>

            </div>

        </form>

    </div>

</div>

</div>

</div>

</section>

{% endblock %}
