{% extends "base.html" %}

{% block title %}
Delete Reminder | PetCare
{% endblock %}


{% block content %}

<section class="pet-page">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

    <div class="delete-card reveal">

        <div class="delete-icon">
            <i class="fa-solid fa-bell"></i>
        </div>

        <span class="page-kicker">
            Care reminder
        </span>

        <h1>
            Delete this reminder?
        </h1>

        <p>
            <strong>
                {{ reminder.title }}
            </strong>

            will be permanently removed from
            {{ pet.name }}'s care schedule.
        </p>


        <form method="post">

            {% csrf_token %}


            <div class="delete-actions">

                <a
                    href="{% url 'reminder_list' pet.pet_id %}"
                    class="pet-btn pet-btn-secondary"
                >
                    Keep reminder
                </a>


                <button
                    type="submit"
                    class="danger-button"
                >
                    <i class="fa-solid fa-trash"></i>
                    Delete reminder
                </button>

            </div>

        </form>

    </div>

</div>

</div>

</div>

</section>

{% endblock %}
