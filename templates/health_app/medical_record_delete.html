{% extends "base.html" %}

{% block title %}Delete Medical Record | PetCare{% endblock %}

{% block content %}

<section class="pet-page">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="delete-card reveal">

    <div class="delete-icon">
        <i class="fa-solid fa-trash"></i>
    </div>

    <span class="page-kicker">
        Medical history
    </span>

    <h1>
        Delete this record?
    </h1>

    <p>
        This medical record and any medication attached to it
        will be permanently removed.
    </p>

    <form method="post">

        {% csrf_token %}

        <div class="delete-actions">

            <a
                href="{% url 'medical_record_detail' pet.pet_id record.record_id %}"
                class="pet-btn pet-btn-secondary"
            >
                Keep record
            </a>

            <button
                type="submit"
                class="danger-button"
            >
                <i class="fa-solid fa-trash"></i>
                Delete permanently
            </button>

        </div>

    </form>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
